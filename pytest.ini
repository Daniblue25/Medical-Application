[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths = search/tests validation
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# Tests that call PubMed (NCBI E-utilities) are excluded by default.
# Run them with: pytest -m network  (requires NCBI_API_KEY and NCBI_EMAIL)
addopts = -m "not network"
markers =
    network: test calls the live PubMed E-utilities API (needs network, NCBI_API_KEY, NCBI_EMAIL)
