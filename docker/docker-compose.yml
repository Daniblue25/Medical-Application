# =============================================================================
# Docker Compose — Local development & testing
# Simulates the Cloud Run environment locally
# =============================================================================
#
# Usage:
#   cd <project-root>
#   docker compose -f docker/docker-compose.yml up --build
#
# Access the app at http://localhost:8080
# =============================================================================

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
